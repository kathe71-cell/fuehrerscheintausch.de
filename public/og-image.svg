<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  
  <!-- Subtle Header Border -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Decorative geometric accents -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Badge -->
  <rect x="130" y="120" width="310" height="42" rx="21" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="150" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#78350f" letter-spacing="0.5">GESETZLICHE FRISTEN 2026</text>

  <!-- Main Title -->
  <text x="130" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">
    Führerschein umtauschen
  </text>
  <text x="130" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#d97706">
    Fristenrechner &amp; Unterlagen nach Anlage 8e FeV
  </text>

  <!-- Description / Key points -->
  <text x="130" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#475569">
    • Stufenplan &amp; Fristen-Check nach Geburtsjahr und Ausstellungsdatum
  </text>
  <text x="130" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#475569">
    • Amtliche Gebührenübersicht, Karteikartenabschrift &amp; Passbild-Vorgaben
  </text>
  <text x="130" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#475569">
    • Fristen bis 2033: Alle Fristen für Papier- &amp; Scheckkartenführerscheine
  </text>

  <!-- Bottom Brand Strip -->
  <line x1="130" y1="485" x2="1070" y2="485" stroke="#f1f5f9" stroke-width="2"/>
  
  <text x="130" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    fuehrerscheintausch.de
  </text>
  <text x="390" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#64748b">
    Unabhängiges Informations- &amp; Fristenportal
  </text>

  <!-- Visual Emblem on the Right -->
  <g transform="translate(850, 160)">
    <!-- License Card Shape -->
    <rect x="0" y="0" width="220" height="140" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
    <rect x="0" y="0" width="220" height="34" rx="14" fill="#f59e0b"/>
    <rect x="0" y="24" width="220" height="10" fill="#f59e0b"/>
    <!-- Photo Box -->
    <rect x="20" y="50" width="50" height="65" rx="6" fill="#334155"/>
    <!-- Chip/Text Lines -->
    <rect x="85" y="55" width="115" height="10" rx="4" fill="#f8fafc"/>
    <rect x="85" y="75" width="90" height="8" rx="4" fill="#94a3b8"/>
    <rect x="85" y="93" width="70" height="8" rx="4" fill="#64748b"/>
    
    <!-- Success Badge / Checkmark -->
    <circle cx="210" cy="140" r="32" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
    <path d="M198 140l8 8 16-16" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
